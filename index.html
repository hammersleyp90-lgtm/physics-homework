<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark instrument bar over a lab-bench background; every question sits on a white exam-paper sheet with graph-paper working space. */
:root{
  --bg:#edf0f6; --paper:#ffffff; --ink:#111a2e; --muted:#55617a; --rule:#d5dbe7;
  --accent:#1f3fbf; --accent-ink:#ffffff; --tint:#e9eefc;
  --bar:#111a2e; --bar-ink:#f3f6fc; --trace:#6fe3c1;
  --green:#0b7a35; --green-tint:#e7f4eb; --warn:#9a5700; --warn-tint:#fdf1dc; --bad:#b3261e;
  --h1:#cf4a43; --h2:#dc9a2e; --h3:#86b955; --h4:#2e8b57; --c1:#f6d2cf; --c2:#fbe6c2; --c3:#dcefc9; --c4:#bfe3cb;
  --display:"STIX Two Text","Times New Roman",Times,serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#0d1220; --paper:#171d2c; --ink:#e8ecf5; --muted:#9aa6bd; --rule:#2c3549; --accent:#93a9ff; --accent-ink:#0b1026; --tint:#1c2540;
    --bar:#080c17; --bar-ink:#e8ecf5; --green:#5fd38a; --green-tint:#14281c; --warn:#f0b65a; --warn-tint:#2e2414; --bad:#f0928a; --c1:#4a2321; --c2:#4a3818; --c3:#2f3d22; --c4:#1d3d2b; }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0d1220; --paper:#171d2c; --ink:#e8ecf5; --muted:#9aa6bd; --rule:#2c3549; --accent:#93a9ff; --accent-ink:#0b1026; --tint:#1c2540;
  --bar:#080c17; --bar-ink:#e8ecf5; --green:#5fd38a; --green-tint:#14281c; --warn:#f0b65a; --warn-tint:#2e2414; --bad:#f0928a; --c1:#4a2321; --c2:#4a3818; --c3:#2f3d22; --c4:#1d3d2b; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:1.75rem} h2{font-size:1.22rem}
.stem i,.part-q i,.ms i,.dgrid i,.why i,.typed i{font-family:var(--display);font-size:1.07em}     /* physical quantities are set in an italic serif, as in print */
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- instrument bar ---- */
.appbar{background:var(--bar);color:var(--bar-ink)}
.appbar-in{max-width:1012px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.12rem;white-space:nowrap}
.brand svg{display:block}
.bar-ctx{margin-left:auto;font-weight:500;font-size:.95rem;opacity:.92;text-align:right}
.bar-ctx + .bar-btn{margin-left:0}
.bar-btn{margin-left:auto;background:transparent;color:var(--bar-ink);border:1.5px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 12px;font-weight:600;font-size:.9rem}
.bar-btn:hover{border-color:var(--bar-ink)}
.appbar :focus-visible{outline-color:var(--trace)}

.wrap{max-width:1012px;margin:0 auto;padding:18px 16px 64px;display:flex;flex-direction:column;gap:18px}
.crumb{display:flex}
.back{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600}
.back:hover{text-decoration:underline}
.mock{font-size:.86rem;color:var(--muted);border:1px dashed var(--rule);border-radius:6px;padding:6px 10px;margin:0}

/* ---- controls ---- */
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 18px;font-weight:600}
.ghost{background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:7.5px 14px;font-weight:600;font-size:.95rem}
.ghost:hover:not(:disabled){border-color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}
.linkbtn.del{color:var(--bad)}
.inp{width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px}
.inp:hover{border-color:var(--muted)}
.lab{font-weight:600;display:block;margin-bottom:4px;font-size:.92rem}
textarea.names{min-height:9em;resize:vertical;line-height:1.5}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.95em}
.err{color:var(--bad);min-height:1.3em;margin:0;font-weight:600}
.err:empty{min-height:0}
.ok{color:var(--green);font-weight:600;margin:0}
.ok:empty{display:none}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:20px clamp(16px,3vw,28px)}
.stack{display:flex;flex-direction:column;gap:14px}
.hw-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.io-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pick{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.msel{position:relative;min-width:0}
.pick>div{min-width:0}
.msel>summary{overflow:hidden;max-width:100%}
.msel-pop label:hover{background:var(--bg)}
.msel-pop label{border-radius:4px}
.msel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.msel>summary::-webkit-details-marker{display:none}
.msel>summary .msel-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel>summary::after{content:'▾';flex:none;color:var(--muted)}
.msel[open]>summary::after{content:'▴'}
.msel-pop{position:absolute;z-index:30;left:0;top:calc(100% + 4px);width:max(100%,340px);max-width:calc(100vw - 32px);max-height:min(60vh,520px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:6px 10px 10px}
.msel-pop fieldset{border:0;border-top:1px solid var(--rule);margin:0;padding:6px 0 4px;min-width:0}
.msel-pop fieldset:first-of-type{border-top:0}
.msel-pop legend{font-weight:600;padding:6px 0 2px;font-size:.95rem}
.msel-pop label{display:flex;gap:8px;align-items:flex-start;padding:4px 0 4px 2px;cursor:pointer;line-height:1.3}
.msel-pop label.sub{padding-left:24px}
.msel-pop input{margin-top:2px;flex:none;width:17px;height:17px}
.msel-bar{position:sticky;top:-6px;background:var(--paper);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:.92rem}
.switch{display:flex;align-items:center;gap:8px}
.pill{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 8px;border:1.5px solid var(--rule);color:var(--muted);white-space:nowrap}
.pill.done{border-color:var(--green);color:var(--green);background:var(--green-tint)}
.pill.prog{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.pill.redo{border-color:var(--warn);color:var(--warn);background:var(--warn-tint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;align-items:center}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;margin-right:5px}
.swatch.sq{border-radius:2px;width:1em;height:1em;vertical-align:-.15em}
.swatch.g{background:var(--green)}

/* ---- login ---- */
.login-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:22px;align-items:stretch;margin-top:12px}
.hero{background:var(--bar);color:var(--bar-ink);border-radius:8px;padding:26px clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px;justify-content:space-between;overflow:hidden}
.hero h1{font-size:2rem}
.hero p{margin:0;opacity:.88;max-width:44ch}
.hero canvas{display:block;width:100%;flex:1 1 150px;min-height:150px;border-radius:6px}
.login{display:flex;flex-direction:column;gap:14px}
.login label{font-weight:600;display:block;margin-bottom:4px;font-size:.92rem}
.login input{width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:9px 10px}
.login input.pin{letter-spacing:.4em;font-family:var(--mono);max-width:9em}

/* ---- progress and question navigation ---- */
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;font-variant-numeric:tabular-nums;font-size:.95rem}
.bar{flex:1 1 160px;height:6px;border-radius:99px;background:var(--rule);overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qchip{min-width:2.7em;border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 9px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.qchip.prog{border-color:var(--accent);color:var(--accent)}
.qchip.done{border-color:var(--green);color:var(--green)}
.qchip.redo{border-color:var(--warn);color:var(--warn)}
.qchip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---- exam-paper sheet ---- */
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:24px clamp(16px,4vw,40px) 30px;display:flex;flex-direction:column;gap:18px}
.q-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.q-head h2{display:flex;align-items:center;gap:8px}
.qbox{display:inline-flex;gap:3px}
.qbox b{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border:1.5px solid var(--ink);font-family:var(--body);font-weight:600;font-size:.92em;font-variant-numeric:tabular-nums}
.tag{font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.q-marks{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.stem{max-width:70ch}
.figs{display:flex;flex-wrap:wrap;gap:18px 26px;justify-content:center;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%}
figcaption{font-weight:700}
.fig{background:#fff;border-radius:4px;padding:10px;max-width:100%;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto}
.figs.mini .fig svg{max-height:240px;width:auto}
table.data{border-collapse:collapse;margin:12px 0 0;font-variant-numeric:tabular-nums;display:block;max-width:100%;overflow-x:auto}
table.data th,table.data td{border:1px solid var(--muted);padding:5px 14px;text-align:center}
table.data th{font-weight:600}
ol.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:30px}
.part-head{display:grid;grid-template-columns:2.2em 1fr auto;gap:0 8px;align-items:start}
.letter{font-weight:700}
.part-q{max-width:62ch}
.marks{font-weight:700;white-space:nowrap;font-size:.95rem}
.part-body{margin:10px 0 0 calc(2.2em + 8px);display:flex;flex-direction:column;gap:10px}
.eq{white-space:nowrap}
.ov{text-decoration:overline}
.warn{color:var(--warn)}
.mixg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 22px}
.mixg fieldset{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:0;min-width:0}
.mixg legend{font-weight:600;padding:0 6px}
.mixg label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer;line-height:1.3}
.mixg input{margin-top:3px;flex:none;width:17px;height:17px}
.mixsum{margin:0;padding-left:1.2em}
.mixsum li{margin:2px 0}
ul.opts{margin:6px 0 0;padding-left:1.2em}
.why{border:1.5px dashed var(--accent);border-radius:6px;padding:8px 12px;font-size:.95rem}
.why b{color:var(--accent)}
.why-s{color:var(--accent);font-size:.88rem}

/* ---- answer space ---- */
.ans{border:1.5px solid var(--muted);border-radius:6px;overflow:hidden;background:var(--paper)}
.ans-label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--rule)}
textarea.type{display:block;width:100%;min-height:6.5em;border:0;border-bottom:1px solid var(--rule);background:var(--paper);padding:10px 12px;resize:vertical;line-height:1.5}
textarea.type:focus{outline:none;box-shadow:inset 3px 0 0 var(--accent)}
.typed{padding:10px 12px;border-bottom:1px solid var(--rule);white-space:pre-wrap;min-height:2.5em}
.typed.empty{color:var(--muted);font-style:italic}
textarea.green{display:block;width:100%;min-height:4.5em;border:0;border-bottom:1px solid var(--rule);background:var(--green-tint);color:var(--green);padding:10px 12px;resize:vertical;font-weight:500}
textarea.green::placeholder{color:var(--green);opacity:.7;font-weight:400}
textarea.green:focus{outline:none;box-shadow:inset 3px 0 0 var(--green)}
.typed.green-text{color:var(--green);font-weight:500;background:var(--green-tint)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--rule)}
.tool{background:transparent;border:1.5px solid var(--rule);border-radius:5px;padding:3px 10px;font-weight:600;font-size:.88rem}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--tint)}
.tools.g .tool[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-tint)}
.tools .sp{flex:1}
.pad{position:relative;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;aspect-ratio:800/380;cursor:crosshair}
.pad.ro canvas{cursor:default}
.pad.scroll{touch-action:auto}
.pad .tap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55);border:0;color:#111a2e;font-weight:600}
.tap[hidden],.tool[hidden]{display:none}
.pad .tap span{background:#fff;border:1.5px solid #55617a;border-radius:6px;padding:8px 16px}

/* ---- locking, mark scheme, self-marking ---- */
.lockbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lock{background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:8px 18px;font-weight:600}
.lock.g{background:var(--green)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--tint);border-radius:6px;padding:8px 12px}
.locked-note{font-size:.9rem;font-weight:600;color:var(--muted);margin:0}
.ms{background:var(--tint);border-left:4px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px}
.ms-tag{display:block;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ms-ans{margin-top:6px}
.ms-sf{color:var(--muted);font-size:.9rem}
.ms-note{margin-top:8px;padding-top:6px;border-top:1px dashed var(--rule);font-size:.95rem;color:var(--muted)}
.ms-note ul{margin:2px 0 0;padding-left:1.2em}
.selfmark{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--green);font-weight:600}
.mk{min-width:2.4em;border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:5px;padding:3px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.mk[aria-pressed="true"]{background:var(--green);color:var(--paper)}
.mk:disabled{cursor:default;opacity:1}
.mk:disabled[aria-pressed="false"]{opacity:.35}
.check{border-left:4px solid var(--muted);background:var(--bg);border-radius:0 6px 6px 0;padding:10px 14px}
.check .ms-tag{color:var(--muted)}
.check.flag{border-left-color:var(--warn);background:var(--warn-tint)}
.check.flag .ms-tag{color:var(--warn)}
.flagtxt{color:var(--warn);font-weight:700}
.submit-box{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.result{border-left:4px solid var(--green);background:var(--green-tint);border-radius:0 6px 6px 0;padding:12px 16px}
.result b{color:var(--green)}
details.sheetdata{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 16px}
details.sheetdata summary{cursor:pointer;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:4px 28px;margin-top:8px;font-size:.95rem}
.dgrid h3{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:10px 0 2px;grid-column:1/-1;font-family:var(--body)}
.dgrid div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--rule);padding:2px 0}
.dgrid div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}

/* ---- tables ---- */
table.res{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.res th,table.res td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
table.res thead th{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--ink)}
table.res td.num,table.res th.num{text-align:right}
table.res tbody tr:last-child td{border-bottom:0}
.setrow{border-top:1px solid var(--rule);padding-top:12px}
textarea.io{width:100%;min-height:8em;font-family:var(--mono);font-size:.82rem;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px}

/* ---- analysis ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:8px;padding:12px 16px}
.tile-v{font-family:var(--display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile-l{font-weight:600;margin-top:2px}
.tile-s{color:var(--muted);font-size:.88rem}
.mrow{display:grid;grid-template-columns:minmax(9em,15em) 1fr 3.2em 4.6em;gap:10px;align-items:center}
.mlabel{text-align:left}
.mval{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mn{font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right}
.meter{position:relative;height:10px;background:var(--rule);border-radius:2px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.meter b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:1px}
i.h1,.swatch.h1{background:var(--h1)} i.h2,.swatch.h2{background:var(--h2)} i.h3,.swatch.h3{background:var(--h3)} i.h4,.swatch.h4{background:var(--h4)}
td.h1{background:var(--c1)} td.h2{background:var(--c2)} td.h3{background:var(--c3)} td.h4{background:var(--c4)}
table.heat{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
table.heat th,table.heat td{border:1px solid var(--rule);padding:6px 8px}
table.heat thead th{font-size:.76rem;font-weight:600;vertical-align:bottom;max-width:7.5em;line-height:1.2;color:var(--muted)}
table.heat tbody th{text-align:left;white-space:nowrap;font-weight:400}
td.hc{text-align:center;font-weight:600;min-width:3em}
tr.classrow th,tr.classrow td{border-top:2px solid var(--ink);font-weight:700}
.hardq{border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch;font-size:.9rem}
.trunc2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.mist{border-top:1px solid var(--rule);padding-top:8px}
details.mist summary{cursor:pointer}
details.mist ul{margin:6px 0 0;padding-left:1.2em;font-size:.95rem}

/* ---- builder ---- */
ol.trayl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.trayl li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--rule);padding-top:8px}
ol.trayl li > div:first-child{min-width:0}
.tray{border-top:3px solid var(--accent)}

<script>
'use strict';

/* ================= homework content ================= */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const eq = s => `<span class="eq">${s}</span>`;

/* ================= question bank: packs built from the question generators ================= */
const BANK = {
  MF: { name: 'Magnetic fields', year: 'Year 13', engine: window.BANK_MF, order: ['FW', 'MC', 'FL', 'EI', 'AC', 'TR'] },
  EL: { name: 'Electricity', year: 'Year 12', engine: window.BANK_EL, order: ['BA', 'IV', 'RS', 'SP', 'EP', 'PD', 'EMF'] },
  PT: { name: 'Particles', year: 'Year 12', engine: window.BANK_PQW, order: ['PA', 'PN', 'PP', 'PI', 'PC'] },
  QU: { name: 'Quantum phenomena', year: 'Year 12', engine: window.BANK_PQW, order: ['QP', 'QE', 'QW'] },
  WA: { name: 'Waves', year: 'Year 12', engine: window.BANK_PQW, order: ['WP', 'WL', 'WS', 'WI', 'WD', 'WR'] },
  MK: { name: 'Mechanics', year: 'Year 12', engine: window.BANK_MECH, order: ['VS', 'MO', 'SL', 'PJ', 'NL', 'MT', 'WE', 'CE'] },
  MAT: { name: 'Materials', year: 'Year 12', engine: window.BANK_MAT, order: ['HK', 'SN', 'YM'] },
  MEA: { name: 'Measurements and their errors', year: 'Year 12', engine: window.BANK_MEA, order: ['UN', 'UE', 'UC'] },
  NU: { name: 'Nuclear physics', year: 'Year 13', engine: window.BANK_NUC, order: ['NR', 'NA', 'ND', 'NI', 'NS', 'NE', 'NF'] },
  FMX: { name: 'Further mechanics', year: 'Year 13', engine: window.BANK_FMX, order: ['CM', 'SH', 'SS', 'FV'] },
  THM: { name: 'Thermal physics', year: 'Year 13', engine: window.BANK_THM, order: ['TE', 'TG', 'TK'] },
  GRV: { name: 'Gravitational fields', year: 'Year 13', engine: window.BANK_GRV, order: ['GN', 'GP', 'GO'] },
  EFD: { name: 'Electric fields and capacitors', year: 'Year 13', engine: window.BANK_EFD, order: ['CL', 'EF', 'EV', 'CP', 'CD'] },
  AST: { name: 'Astrophysics', year: 'Year 13', engine: window.BANK_AST, order: ['AT', 'AM', 'AB', 'AH', 'AZ'] }
};
const SUB_OF = {}; Object.keys(BANK).forEach(k => BANK[k].order.forEach(t => { SUB_OF[t] = k; }));
const tplTopic = tpl => tpl.replace(/\d+/, '');
// question types that draw on a second sub-topic as well as their own: used to pick questions that link sub-topics together
const LINKS = {
  FL1: ['EI'], FL2: ['EI'], FL3: ['EI'], FL4: ['EI'], FL6: ['EI'], FL7: ['EI'],
  EI2: ['FL', 'AC'], EI3: ['FW'], EI7: ['FL'], EI8: ['FL'], EI11: ['FL', 'AC'], EI12: ['FL', 'AC'],
  TR1: ['EI', 'AC'], TR4: ['AC'], TR5: ['AC'], TR8: ['EI'], TR10: ['EI'], AC5: ['EP'], AC6: ['EP'], TR3: ['EP'], TR9: ['EP'],
  MC4: ['PA'], MC6: ['PA'], MC5: ['QE', 'BA'], MC10: ['QE'],
  IV1: ['SP'], IV2: ['EP'], IV4: ['SP'], IV5: ['SP'], IV6: ['BA', 'EP'], IV8: ['SP', 'EP'], IV9: ['SP'], IV10: ['SP'], IV12: ['EP'], IV13: ['SP', 'EP'],
  PD2: ['IV'], PD3: ['EP'], PD6: ['IV'], PD8: ['IV'], PD9: ['SP', 'EP'], PD10: ['SP'], PD11: ['EP'], PD12: ['IV'],
  SP1: ['EP'], SP2: ['EP'], SP5: ['EP'], SP6: ['BA', 'EP'], SP8: ['EP'], SP11: ['EP'], SP12: ['EP'],
  EMF1: ['EP'], EMF5: ['EP'], EMF6: ['SP'], EMF7: ['SP', 'EP'], EMF8: ['EP'], EMF9: ['EP'], EMF12: ['EP'], EMF13: ['SP'],
  BA1: ['EP'], BA4: ['EP', 'QE'], EP2: ['RS'], EP4: ['SP'], RS4: ['EP'], RS5: ['BA'],
  PA4: ['PN'], PN2: ['PA'], PN3: ['PC', 'PA'], PN4: ['PA'], PN5: ['PI'], PI2: ['PN', 'PC'], PI4: ['PN', 'PC'], PI5: ['PN'], PC3: ['PN', 'PI'], PC5: ['PI', 'PP'], PC2: ['PP'],
  PP1: ['QP', 'WP'], PP5: ['WP'], PP2: ['QE'],
  QP1: ['PP'], QP2: ['PP'], QP3: ['QE'], QP6: ['PP'], QE1: ['PP'], QE2: ['PP'], QE4: ['PP'], QE5: ['PP', 'WD'], QE6: ['QW'],
  QW2: ['QE', 'WD'], QW3: ['QP', 'WD'], QW4: ['WD'], QW5: ['QE'],
  WL1: ['WP'], WL3: ['WP'], WL4: ['WP'], WL5: ['WP'], WS1: ['WP'], WS2: ['WP'], WS3: ['WP', 'WI'], WS5: ['WP'],
  WI3: ['WP'], WI5: ['WD'], WD4: ['WI'], WD5: ['QE'], WD6: ['WP'], WR1: ['WP'], WP4: ['WR'], WP5: ['WR'],
  NR3: ['NS'], NR5: ['NS'], NS3: ['NR', 'QW'], NS5: ['NR'], NA4: ['ND'], ND7: ['NA', 'NI'], NI1: ['PN'], NI2: ['PN', 'NA'], NI3: ['PP', 'QE'], NI4: ['PN', 'PI'], NI5: ['NA', 'PP'], NI6: ['PN', 'PA'],
  NE1: ['PA'], NE2: ['NF'], NE3: ['NF'], NE5: ['NI', 'NA'], NF4: ['NA', 'NI'], NF5: ['NE'], NF1: ['NE'], ND3: ['NA'], ND4: ['NI'],
  VS1: ['WE'], VS4: ['NL'], MO5: ['VS'], SL6: ['WE'], PJ1: ['SL', 'VS'], PJ2: ['VS', 'SL'], PJ4: ['SL'], PJ5: ['VS'], NL1: ['SL'], NL3: ['VS', 'SL'], NL5: ['MT'], NL7: ['SL'],
  MT1: ['WE'], MT2: ['WE'], MT3: ['NL'], MT5: ['CE'], MT6: ['NL'], MT7: ['NL'], WE1: ['VS'], WE2: ['NL', 'VS'], WE4: ['CE'], WE6: ['SL', 'CE'], CE1: ['WE'], CE3: ['WE', 'SL'], CE4: ['SL'], SL3: ['CE'], FW6: ['NL', 'SL'], FW3: ['VS'],
  HK2: ['SN'], HK4: ['SN'], HK6: ['UE'], SN3: ['CE', 'HK'], SN4: ['CE'], SN1: ['HK'], YM2: ['SN'], YM4: ['UC', 'HK'], YM6: ['SN'], UC1: ['HK'], UC2: ['BA'], UC3: ['SS'], UC5: ['YM'], UE4: ['RS'], UE5: ['SS'], UE3: ['SL'],
  CL2: ['GN', 'CM'], CL3: ['VS'], CL5: ['GN'], EF3: ['PJ'], EF6: ['EV'], EV3: ['EF'], EV5: ['EF'], EV6: ['QE'], EV4: ['EF'], EF1: ['NL'], MC3: ['EF'], MC5: ['QE', 'BA', 'EV'], NR3: ['NS', 'EV'], NR5: ['NS', 'EV'],
  GN1: ['GO'], GP4: ['GN'], GP6: ['GO'], GP3: ['CE'], GO1: ['CM'], GO2: ['CM'], GO4: ['CM'], GO6: ['GN'], GP5: ['GN'],
  TG1: ['TK'], TG5: ['TK'], TG6: ['TK'], TG4: ['WE'], TK1: ['TG'], TK6: ['TG'], TE6: ['EP'], TE1: ['EP'],
  CM2: ['NL'], CM3: ['CE'], CM4: ['VS'], CM6: ['NL'], SH5: ['SS'], SS1: ['HK'], SS2: ['UE'], SS4: ['UC'], SS3: ['SH'], FV2: ['SS'], FV4: ['SS'], FV5: ['SS'],
  AT4: ['WD'], AB4: ['QE'], AB3: ['AH'], AH3: ['GP'], AH4: ['AB', 'AM'], AH5: ['NS'], AM6: ['AZ'], AZ3: ['CM'], AZ4: ['AB'], AB5: ['NA'],
  CP2: ['EF'], CP4: ['EP'], CP6: ['EP'], CP5: ['EF'], CD1: ['CP'], CD2: ['CP', 'ND'], CD3: ['CP'], CD4: ['CP'], CD6: ['CP']
};
// a homework made from several sub-topics: questions that link the chosen sub-topics first, then about the same number from each
function generateMix(topics, marks, useLinks, seedStr){
  const rnd = seeded(seedStr), S = new Set(topics), items = [], count = {}, used = new Set(); let total = 0;
  topics.forEach(t => { count[t] = 0; });
  const tplsOf = t => BANK[SUB_OF[t]].engine.TEMPLATES.filter(x => tplTopic(x) === t);
  const add = (tpl, why, slack = 3) => {
    const sub = SUB_OF[tplTopic(tpl)], code = tpl + '-' + (10000 + Math.floor(rnd() * 90000)); let q;
    try { q = makeQ(sub, code); } catch (e) { return false; }
    if ((q.errors && q.errors.length) || total + q.marks > marks + slack) return false;
    items.push(Object.assign({ sub, code, marks: q.marks, topic: q.topic }, why ? { why, link: true } : {})); used.add(tpl); total += q.marks; count[q.topic]++; return true;
  };
  if (useLinks && topics.length > 1){
    const cands = rnd.shuffle(topics.flatMap(tplsOf).filter(x => (LINKS[x] || []).some(o => S.has(o))));
    const maxLinks = Math.max(1, Math.round(marks / 8 * 0.35)), pairs = new Set();
    for (const tpl of cands){
      if (items.length >= maxLinks) break;
      const home = tplTopic(tpl), others = LINKS[tpl].filter(o => S.has(o)), key = [home, ...others].sort().join('+');
      if (pairs.has(key) || count[home] >= 1) continue;
      const low = t => { const n = topicName(t); return /^[A-Z][a-z]/.test(n) ? n[0].toLowerCase() + n.slice(1) : n; };
      if (add(tpl, `This question links ${low(home)} with ${others.map(low).join(' and ')}.`)) pairs.add(key);
    }
  }
  const queue = {}; topics.forEach(t => { queue[t] = rnd.shuffle(tplsOf(t).filter(x => !used.has(x))); });
  const blocked = new Set();
  while (total < marks - 2 && blocked.size < topics.length){
    const t = topics.filter(x => !blocked.has(x)).sort((a, b) => count[a] - count[b] || topics.indexOf(a) - topics.indexOf(b))[0];
    if (!queue[t].length) queue[t] = rnd.shuffle(tplsOf(t));
    const i = queue[t].findIndex(tpl => add(tpl));          // the first unused type that fits in the marks that are left
    if (i < 0) blocked.add(t); else queue[t].splice(i, 1);
  }
  if (total < marks - 4){                                     // nothing else fits exactly: allow one question that runs a little over
    const t = topics.slice().sort((a, b) => count[a] - count[b])[0]; rnd.shuffle(tplsOf(t).filter(x => !used.has(x))).some(tpl => add(tpl, null, 6));
  }
  const pos = t => Object.keys(BANK).indexOf(SUB_OF[t]) * 100 + BANK[SUB_OF[t]].order.indexOf(t);
  items.sort((a, b) => (a.link ? 1 : 0) - (b.link ? 1 : 0) || pos(a.topic) - pos(b.topic));
  return { items, total, count, links: items.filter(x => x.link).length, missing: topics.filter(t => !count[t]) };
}
// pack lengths: about 1.5 minutes per mark, which includes self-marking and corrections
const SIZES = [{ min: 30, marks: 20, label: 'About 30 minutes', short: '30 minutes' }, { min: 60, marks: 40, label: 'About 1 hour', short: '1 hour' },
  { min: 90, marks: 60, label: 'About 1.5 hours', short: '1.5 hours' }, { min: 120, marks: 80, label: 'About 2 hours', short: '2 hours' }];
const PACK_LETTERS = 'ABCDE';
function parsePack(id){
  const [sub, topic, mins, letter] = String(id).split('.'), B = BANK[sub], size = SIZES.find(x => x.min === +mins);
  if (!B || !B.engine || !size || !(topic === 'ALL' || B.order.includes(topic)) || !letter || letter.length !== 1 || !PACK_LETTERS.includes(letter)) return null;
  return { sub, topic, B, size, letter, topicName: topic === 'ALL' ? 'whole topic' : B.engine.TOPICS[topic] };
}
function packTitle(id){ const p = parsePack(id); return p ? `${p.B.name}: ${p.topicName} · ${p.size.short} · Pack ${p.letter}` : null; }
function seeded(str){                       // small repeatable random-number generator, so a pack is always the same
  let a = 2166136261; for (const ch of str){ a ^= ch.charCodeAt(0); a = Math.imul(a, 16777619); }
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  return r;
}
function chooseQuestions(p, id){            // picks question types in turn from each sub-topic until the marks reach the target
  const E = p.B.engine, rnd = seeded(id), topics = p.topic === 'ALL' ? rnd.shuffle(p.B.order) : [p.topic];
  const pool = {}; topics.forEach(t => { pool[t] = rnd.shuffle(E.TEMPLATES.filter(x => x.replace(/\d+/, '') === t)); });
  const used = new Set(), qs = []; let total = 0, turn = 0, idle = 0;
  // no question type appears twice in a pack: a sub-topic with few types gives a shorter pack instead
  while (total < p.size.marks - 2 && idle < topics.length){
    const t = topics[turn++ % topics.length]; let placed = false;
    for (const tpl of pool[t].filter(x => !used.has(x))){
      let q; try { q = normQ(E.makeQuestion(tpl, 10000 + Math.floor(rnd() * 90000))); } catch (e) { used.add(tpl); continue; }
      if (q.errors && q.errors.length){ used.add(tpl); continue; }
      if (total + q.marks > p.size.marks + 3) continue;          // too long for the space left: keep it for another pack
      qs.push(q); total += q.marks; used.add(tpl); placed = true; break;
    }
    idle = placed ? 0 : idle + 1;
  }
  return qs.sort((a, b) => p.B.order.indexOf(a.topic) - p.B.order.indexOf(b.topic));
}
const MIN_PER_MARK = 1.5;
const fmtMins = m => { m = Math.max(5, Math.round(m / 5) * 5); return m < 60 ? `${m} minutes` : `${Math.floor(m / 60)} hour${m >= 120 ? 's' : ''}${m % 60 ? ' ' + (m % 60) + ' minutes' : ''}`; };
const INTRO = len => `This homework should take about ${len}. Answer every part in the space below it: type, draw on the graph paper, or both. When you are happy with an answer, lock it in to see the mark scheme, then mark your own work in green. Mark schemes carry unrounded values through each calculation, so count your answer as correct if it only differs in the last figure because you rounded earlier.`;
// figures are numbered in the order the question mentions them
function normQ(q){
  if (q._n) return q; q._n = true;
  const figs = q.figures || [q.circuitSvg, q.graph].filter(Boolean), a = q.stem.indexOf('Figure 1'), b = q.stem.indexOf('Figure 2');
  if (figs.length === 2 && a >= 0 && b >= 0 && b < a){
    const sw = t => t.replace(/Figure ([12])/g, (m, d) => 'Figure ' + (3 - d));
    q.figures = [figs[1], figs[0]]; q.stem = sw(q.stem);
    q.parts.forEach(P => { P.q = sw(P.q); P.ms = sw(P.ms); if (P.guide) P.guide = P.guide.map(sw); });
  }
  return q;
}
function makeQ(sub, code){ const i = code.lastIndexOf('-'), E = BANK[sub].engine, q = normQ(E.makeQuestion(code.slice(0, i), +code.slice(i + 1))); q.sub = sub; q.E = E; return q; }
function buildHW(id, title, intro, qs){
  const part = (P, E) => {
    const ansShow = P.ans !== undefined && !P.options ? (P.sfMark ? P.sfMark.shown : (P.show || E.disp(P.ans))) : null;
    const out = { q: P.q, marks: P.marks, ms: P.ms, first: P.ms.split('<br>')[0], sf: !!P.sfMark, unit: !!P.unitMark,
      raw: { ans: P.ans, unit: P.unit, options: P.options, correct: P.correct, show: ansShow, ms: P.ms },
      kind: /^(Sketch|Draw)|\b(sketch|draw)\b/i.test(P.q) ? 'graph' : P.ans !== undefined && !P.options ? (/read(ing)? from/i.test((P.guide || []).join(' ')) || /gradient of the graph|Use Figure \d to determine/i.test(P.q) ? 'graph' : 'calc') : 'written' };
    if (P.options && /listed|^Which|^Identify/.test(P.q)) out.q += '<ul class="opts">' + P.options.map(o => `<li>${o}</li>`).join('') + '</ul>';
    if (P.ans !== undefined && !P.options) out.ms += `<div class="ms-ans">Answer: <b>${P.sfMark ? P.sfMark.shown : (P.show || E.disp(P.ans))}${P.unit === '°' ? '' : ' '}${P.unit}</b>` +
      (P.sfMark ? ` <span class="ms-sf">(to ${P.sfMark.accept.join(' or ')} significant figures)</span>` : P.abs === undefined && !P.tol && (!P.show || /^[\d.]+$/.test(P.show)) ? ' <span class="ms-sf">(accept answers correctly rounded to 2 or more significant figures)</span>' : '') + '</div>';
    if (P.guide && P.guide.length) out.note = '<span class="ms-tag">Additional guidance</span><ul>' + P.guide.map(g => `<li>${g}</li>`).join('') + '</ul>';
    return out;
  };
  const hw = { id, title, intro, codes: qs.map(q => q.code),
    questions: qs.map(q => ({ tag: q.topicName, code: q.code, sub: q.sub, topic: q.topic, tpl: q.id, stem: q.stem, figs: q.figures || [q.circuitSvg, q.graph].filter(Boolean), parts: q.parts.map(P => part(P, q.E)) })) };
  hw.questions.forEach((Q, qi) => Q.parts.forEach((P, pi) => { P.id = (qi + 1) + String.fromCharCode(97 + pi); P.letter = '(' + String.fromCharCode(97 + pi) + ')'; }));
  hw.allParts = hw.questions.flatMap(Q => Q.parts);
  hw.total = hw.allParts.reduce((a, x) => a + x.marks, 0);
  return hw;
}
function withWhy(hw, items){ hw.questions.forEach((Q, i) => { if (items[i] && items[i].why) Q.why = items[i].why; }); return hw; }
function toHomework(p, id, qs){
  qs.forEach(q => { q.sub = p.sub; q.E = p.B.engine; });
  const marks = qs.reduce((a, q) => a + q.marks, 0), len = marks < p.size.marks - 6 ? fmtMins(marks * MIN_PER_MARK) : p.size.short;   // a short pack says how long it really is
  const hw = buildHW(id, packTitle(id).replace(' · ' + p.size.short + ' · ', ' · ' + len + ' · '), INTRO(len), qs);
  hw.short = marks < p.size.marks - 6; return hw;
}
const PACKS = {};
function getHW(id){                          // a pack that has been set keeps its saved list of question codes
  if (PACKS[id] !== undefined) return PACKS[id];
  if (String(id).startsWith('CU.')){
    const c = DB.custom[id]; if (!c) return (PACKS[id] = null);
    const qs = []; c.items.forEach(it => { try { qs.push(makeQ(it.sub, it.code)); } catch (e) {} });
    return (PACKS[id] = withWhy(buildHW(id, c.title, INTRO(fmtMins(qs.reduce((a, q) => a + q.marks, 0) * MIN_PER_MARK)), qs), c.items));
  }
  const p = parsePack(id); if (!p) return (PACKS[id] = null);
  const saved = DB.packs && DB.packs[id]; let qs;
  try { qs = saved ? saved.map(c => { const [tpl, seed] = c.split('-'); return normQ(p.B.engine.makeQuestion(tpl, +seed)); }) : chooseQuestions(p, id); } catch (e) { qs = chooseQuestions(p, id); }
  return (PACKS[id] = toHomework(p, id, qs));
}
let HW = null, ALL_PARTS = [], TOTAL = 0;       // the homework currently on screen
function setHW(hw){ HW = hw; ALL_PARTS = hw.allParts; TOTAL = hw.total; }
let CURQ = 0;                                   // the question currently on screen

/* ================= storage: shared Supabase database (see supabase/schema.sql) ================= */
// The page keeps everything it is allowed to see in DB, exactly as before. Saving works out which records changed
// since the last successful save and sends only those. Students can only ever send their own work.
const CFG = window.HW_CONFIG || {};
let DB = { v: 4, students: {}, classes: {}, packs: {}, staff: {}, checks: {}, custom: {} };
let SESSION = null;                       // { kind: 'student' | 'staff', token }
try { SESSION = JSON.parse(sessionStorage.getItem('hw-session') || 'null'); } catch (e) {}
function setSession(x){ SESSION = x; try { x ? sessionStorage.setItem('hw-session', JSON.stringify(x)) : sessionStorage.removeItem('hw-session'); } catch (e) {} }
async function rpc(fn, args, keepalive){
  let r;
  try { r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, { method: 'POST', keepalive: !!keepalive, headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) }); }

    if (SESSION.kind === 'staff') for (const k of BASE.keys()) if (!cur.has(k)) del.push(k);
    if (!put.length && !del.length){ pending = false; saveFailed(false); return; }

/* ================= correction rules (run instantly, no AI) ================= */
// common words that almost any genuine correction contains; keyboard mashing almost never does
const COMMON = new Set(('a an the i it is was be been should would not no to of in on at for from by with and or but so as because than then ' +
  'this that these those my me forgot forget missed wrong right correct mistake used use instead need needed needs have had has did do ' +
  'answer method unit units convert converted conversion power ten sign direction force field current wire charge equal equals into out ' +
  'when same more less larger smaller up down left right zero why how what which per').split(' '));
function textLooksReal(t){
  const words = t.match(/[A-Za-z]+|\d+(?:\.\d+)?/g) || [];
  if (words.length < 4) return false;
  const real = words.filter(w => /^\d/.test(w) || w.length <= 2 ||                       // numbers and unit symbols (m, cm, N, V, Wb)
    (w.length <= 20 && /[aeiouy]/i.test(w) && !/(.)\1\1/i.test(w) && !/[bcdfghjklmnpqrstvwxz]{5,}/i.test(w)));
  const lower = words.map(w => w.toLowerCase());
  const common = lower.filter(w => COMMON.has(w)).length;
  return real.length / words.length >= 0.75 && new Set(lower).size >= 3 && common >= 2;
}
function greenInk(st){
  return st.strokes.filter(s => s.c === 'g' && !s.t).reduce((a, s) => { let L = 0; for (let i = 2; i < s.p.length; i += 2) L += Math.hypot(s.p[i] - s.p[i - 2], s.p[i + 1] - s.p[i - 1]); return a + L; }, 0);
}
const greenSig = st => st.green.trim() + '|' + st.strokes.filter(k => k.c === 'g' && !k.t).length + '|' + Math.round(greenInk(st));
function correctionProblem(st){
  const t = st.green.trim(), ink = greenInk(st);
  if (t && !textLooksReal(t)) return 'Your typed correction doesn’t read as a real explanation. Write at least a sentence saying what you got wrong and what the right answer or method is.';
  if (!t && ink === 0) return 'Add your corrections in green (type or draw) before you lock in your mark. Ticks and crosses on their own don’t count.';
  if (!t && ink < 150) return 'Your green drawing is too small to be a correction. Redraw the correct answer, or type what you got wrong.';
  return null;
}

function partIssue(c, s){                      // what Claude's check found for one part, or '' if it agrees

// an oscilloscope screen showing one sinusoidal trace, 2 divisions in amplitude and 4 divisions per cycle
function drawScope(cv){
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  const c = cv.getContext('2d'), W = r.width, H = r.height, div = H / 6; c.setTransform(d, 0, 0, d, 0, 0);
  c.fillStyle = '#0a101d'; c.fillRect(0, 0, W, H);
  c.lineWidth = 1;
  for (let x = W / 2 % div; x < W; x += div){ c.strokeStyle = Math.abs(x - W / 2) < .5 ? 'rgba(255,255,255,.38)' : 'rgba(255,255,255,.11)'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 0; y <= H + .5; y += div){ c.strokeStyle = Math.abs(y - H / 2) < .5 ? 'rgba(255,255,255,.38)' : 'rgba(255,255,255,.11)'; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.strokeStyle = '#6fe3c1'; c.lineWidth = 2.2; c.lineJoin = 'round'; c.beginPath();
  for (let x = 0; x <= W; x += 2){ const y = H / 2 - 2 * div * Math.sin(2 * Math.PI * (x - W / 2) / (4 * div)); if (x) c.lineTo(x, y); else c.moveTo(x, y); }
  c.stroke();
}

/* ================= exam mode ================= */
// Approximate grade boundaries (% of the marks): the average of AQA A-level Physics (7408) overall boundaries, June 2024–2026.
const GRADES = [['A*', 73], ['A', 60], ['B', 50], ['C', 40], ['D', 30], ['E', 21]];
let SKEW = 0;                                     // server clock minus this device's clock, so a changed clock can't buy extra time
const nowMs = () => Date.now() + SKEW;
const setSkew = r => { if (r && r.now) SKEW = Date.parse(r.now) - Date.now(); };
function examFor(id, stu){                        // exam settings for a homework from the student's class, or null if it isn't an exam
  const st = stu || ME; if (!st) return null;
  for (const c of classesOf(st)){ const a = c.assigned[id]; if (a && a.exam && (!a.only || a.only.includes(st.key))) return a.exam; }
  return null;
}
const allowedMins = (ex, stu) => Math.round(ex.minutes * (1 + (+stu.extraTime || 0) / 100));
function examPhase(ex, w){
  const t = nowMs(), e = w.exam || {};
  if (t < Date.parse(ex.opens)) return 'notyet';
  if (t >= Date.parse(ex.closes)) return 'marking';
  if (!e.started) return 'ready';
  if (e.finished || t >= Date.parse(e.ends)) return 'waiting';
  return 'running';
}
const gradeFor = (pct, b) => { for (const [g, v] of (b || GRADES)) if (pct >= v) return g; return 'U'; };
const fmtClock = ms => { const x = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(x / 60); return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(x % 60).padStart(2, '0'); };
const pad2 = n => String(n).padStart(2, '0');
const localDT = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function lockAllExam(w, at){ let n = 0; ALL_PARTS.forEach(P => { const x = w.parts[P.id]; if (!x.locked){ x.locked = at; n++; } }); return n; }
function shuffledFor(hw, key){                    // same order every time for one student, different between students
  let x = 7; for (const ch of key + '|' + hw.id) x = (x * 31 + ch.charCodeAt(0)) | 0;
  const rnd = () => { x = (Math.imul(x, 1103515245) + 12345) | 0; return ((x >>> 8) % 100000) / 100000; };
  const qs = hw.questions.slice(); for (let i = qs.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [qs[i], qs[j]] = [qs[j], qs[i]]; }
  return Object.assign({}, hw, { questions: qs });
}
let TICK = null, WATCH = null;
function stopExamWatch(){
  clearInterval(TICK); TICK = null;
  if (WATCH){ window.removeEventListener('blur', WATCH.out); window.removeEventListener('focus', WATCH.back); document.removeEventListener('visibilitychange', WATCH.vis); WATCH = null; }
}
function watchLeaving(w){                         // record each time the student switches away from the exam, and for how long
  let away = null;
  const out = () => { if (away === null) away = Date.now(); };
  const back = () => { if (away === null) return; const secs = Math.round((Date.now() - away) / 1000), t = new Date(away + SKEW).toISOString(); away = null;
    if (secs < 1 || !w.exam) return; (w.exam.leaves = w.exam.leaves || []).push({ t, s: secs }); if (w.exam.leaves.length > 300) w.exam.leaves.shift(); save(true); };
  const vis = () => document.visibilityState === 'hidden' ? out() : back();
  window.addEventListener('blur', out); window.addEventListener('focus', back); document.addEventListener('visibilitychange', vis);
  WATCH = { out, back, vis };
}
async function startExam(w){
  const r = await rpc('hw_exam_start', { p_token: SESSION.token, p_hw: HW.id });
  if (r.error) throw new Error(r.error);
  setSkew(r); w.exam = Object.assign(w.exam || {}, { started: r.started, ends: r.ends, leaves: (w.exam && w.exam.leaves) || [] });
  save(true);
}
async function examRejected(){                    // the server refused late changes: reload the saved copy
  try { const r = await rpc('hw_student_load', { p_token: SESSION.token }); dbFromRows(r.rows); setSkew(r); ME = DB.students[r.login]; } catch (e) {}
  saveFailed(false); pending = false; screenList();
  app.prepend(h('div', { class: 'card flag', role: 'alert' }, 'Your exam time had already ended, so your last changes couldn’t be saved. Everything you did before the end is kept.'));
}
function screenExam(ex, w){
  const phase = examPhase(ex, w), base = getHW(HW.id);
  if (ex.shuffle) setHW(shuffledFor(base, ME.key));
  if (phase === 'marking'){ if (lockAllExam(w, ex.closes)) save(true); return screenHomework(true); }
  app.replaceChildren();
  app.append(topbar(whoAmI(), screenList), h('header', {}, h('h1', {}, HW.title)));
  const mins = allowedMins(ex, ME), extra = +ME.extraTime || 0;
  if (phase === 'notyet'){ app.append(h('div', { class: 'card' }, 'This exam opens on ', h('b', {}, fmtWhen(ex.opens)), '.')); return; }
  if (phase === 'ready'){
    const err = h('p', { class: 'err', role: 'alert' });
    const go = h('button', { type: 'button', class: 'primary', onclick: async () => { go.disabled = true; err.textContent = '';
      try { await startExam(w); CURQ = 0; screenHomework(); } catch (e) { go.disabled = false; err.textContent = e.message === 'closed' ? 'This exam has closed.' : e.message === 'not_open' ? 'This exam isn’t open yet.' : 'Couldn’t start the exam. Check your internet connection and try again.'; } } }, 'Start exam');
    app.append(h('div', { class: 'card stack exam-rules' },
      h('h2', {}, 'Exam conditions'),
      h('ul', {}, h('li', {}, h('b', {}, `You have ${mins} minutes`), extra ? ` (including ${extra}% extra time)` : '', ' from when you press Start. The clock keeps running if you close the page.'),
        h('li', {}, `${HW.questions.length} questions, ${HW.total} marks. Answer in black: type, draw or both. Your answers save as you go.`),
        h('li', {}, 'When the time runs out your answers are locked. You can also finish early.'),
        h('li', {}, 'The mark scheme opens for everyone when the exam closes on ', h('b', {}, fmtWhen(ex.closes)), '. You then mark your own answers in green, as with homework.'),
        ex.booklet ? h('li', {}, 'You can open the data and formulae booklet at any time.') : null,
        ex.logLeave ? h('li', {}, 'Your teacher can see each time you leave this page during the exam, and for how long.') : null),
      err, h('div', {}, go)));
    return;
  }
  if (phase === 'waiting'){
    if (lockAllExam(w, w.exam.finished || w.exam.ends)) save(true);
    app.append(h('div', { class: 'card stack' }, h('b', {}, 'Exam finished. Your answers are saved.'),
      h('span', { class: 'muted' }, 'The mark scheme opens when the exam closes on ', h('b', {}, fmtWhen(ex.closes)), '. Come back then to mark your answers in green.')));
    const go = i => { CURQ = i; window.scrollTo(0, 0); screenHomework(); };
    CURQ = Math.min(CURQ, HW.questions.length - 1);
    app.append(pager(go, Q => qState(Q, w)), sheetFor(HW.questions[CURQ], CURQ, w, 'examdone', () => screenHomework()), prevNext(go));
    return;
  }
  // running
  const ends = Date.parse(w.exam.ends);
  const clock = h('b', { class: 'clock', 'aria-live': 'off' }), finishBox = h('span', {});
  const finish = (timeUp) => { stopExamWatch(); w.exam.finished = new Date(timeUp ? ends : nowMs()).toISOString(); lockAllExam(w, w.exam.finished); save(true); CURQ = 0; screenHomework(); };
  const tick = () => { const left = ends - nowMs(); clock.textContent = fmtClock(left); clock.parentNode && clock.parentNode.classList.toggle('low', left < 5 * 60000); if (left <= 0) finish(true); };
  const bar = h('div', { class: 'examtimer', role: 'timer' }, h('span', {}, 'Time left ', clock), ex.booklet ? booklet(HW) : null,
    twoClick('Finish exam', 'Click again to finish: you can’t change answers afterwards', () => finish(false), { class: 'ghost' }));
  app.append(bar);
  if (ex.logLeave) app.append(h('p', { class: 'muted', style: 'margin:0;font-size:.9rem' }, 'Leaving this page is recorded for your teacher.'));
  CURQ = Math.min(CURQ, HW.questions.length - 1);
  const go = i => { CURQ = i; window.scrollTo(0, 0); screenHomework(); };
  const qs = Q => Q.parts.some(P => { const x = w.parts[P.id]; return x.text.trim() || x.strokes.length; }) ? 'prog' : '';
  app.append(pager(go, qs), sheetFor(HW.questions[CURQ], CURQ, w, 'exam', () => {}), prevNext(go));
  if (ex.logLeave) watchLeaving(w);
  tick(); TICK = setInterval(tick, 1000);
}


function screenHomework(examMarking){
  stopExamWatch();
  const ex = !examMarking && examFor(HW.id);
  if (ex) return screenExam(ex, workFor(ME));
  const w = workFor(ME), mode = w.submitted ? 'view' : 'edit';
  const y = window.scrollY;
  app.replaceChildren();
  const refresh = () => screenHomework();
  const s = stats(w);
  app.append(topbar(whoAmI(), screenList));
  app.append(h('header', {}, h('h1', {}, HW.title), h('p', { class: 'muted', style: 'margin:4px 0 0;max-width:65ch' }, HW.intro)));
  app.append(h('div', { class: 'legend' },
    h('span', {}, h('span', { class: 'swatch', style: 'background:var(--ink)' }), 'Before locking: your attempt'),
    h('span', { style: 'color:var(--green);font-weight:600' }, h('span', { class: 'swatch g' }), 'After locking: corrections and marking')), dataSheet(HW));
  if (examMarking && !w.submitted) app.append(h('div', { class: 'card', role: 'status' }, 'The exam has closed and the mark scheme is open. Mark each answer in green, then submit.'));
  const pct = Math.round(100 * (s.locked + s.marked) / (2 * s.n));
  app.append(h('div', { class: 'progress', 'aria-live': 'polite' },
    h('span', {}, `Answered ${s.locked}/${s.n}`), h('span', {}, `Marked ${s.marked}/${s.n}`),
    h('span', { class: 'bar' }, h('i', { style: `width:${pct}%` })),
    h('b', {}, `Score so far: ${s.score}/${TOTAL}`)));

  const back = ALL_PARTS.filter(P => w.parts[P.id].redo);
  if (back.length && !w.submitted) app.append(h('div', { class: 'check flag', role: 'status' }, h('span', { class: 'ms-tag' }, '⚑ Sent back by your teacher'),
    h('div', {}, `${back.length === 1 ? 'One part needs' : back.length + ' parts need'} another look: `, h('b', {}, back.map(partLabel).join(', ')), '. Everything else stays as you left it. Submit again when you’ve finished.')));
  CURQ = Math.min(CURQ, HW.questions.length - 1);
  const go = i => { CURQ = i; window.scrollTo(0, 0); screenHomework(); };
  app.append(pager(go, Q => qState(Q, w)));
  app.append(sheetFor(HW.questions[CURQ], CURQ, w, mode, refresh));
  app.append(prevNext(go));

  // submit
  const box = h('div', { class: 'card submit-box' });
  if (w.submitted){
    box.append(h('div', { class: 'result' }, 'Submitted ', new Date(w.submitted).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }), '. Your self-marked score: ', h('b', {}, `${s.score}/${TOTAL} (${Math.round(100 * s.score / TOTAL)}%)`), '. Your teacher will check your marking.'));
  } else {
    const ready = s.locked === s.n && s.marked === s.n;
    box.append(h('h2', {}, 'Submit homework'),
      h('p', { class: 'muted', style: 'margin:0' }, ready ? (w.reopened ? 'Corrections done. Submit again for your teacher.' : 'Every part is locked and self-marked.') : `Lock in your answer and your mark for every part to submit (${s.n - s.marked} still to do).`));
    const sb = h('button', { type: 'button', class: 'primary', disabled: !ready, onclick: () => {
      sb.replaceWith(h('div', { class: 'confirm' }, h('span', {}, 'Submit to your teacher? You won’t be able to add more green corrections.'),
        h('button', { type: 'button', class: 'primary', onclick: () => { w.submitted = new Date().toISOString(); delete w.reopened; save(true); screenHomework(); window.scrollTo(0, document.body.scrollHeight); } }, 'Yes, submit'),
        h('button', { type: 'button', class: 'ghost', onclick: screenHomework }, 'Cancel')));
    } }, 'Submit');
    box.append(sb);
  }
  app.append(box);
  requestAnimationFrame(() => window.scrollTo(0, y));
}

/* ================= classes, login names and PINs ================= */
const classStudents = cls => Object.values(DB.students).filter(s => (s.classIds || []).includes(cls.id));
const classesOf = stu => (stu.classIds || []).map(id => DB.classes[id]).filter(Boolean);
function parseNames(text){
  return text.split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    if (l.includes(',')){ const [a, b] = l.split(',').map(x => x.trim()); if (b) l = b + ' ' + a; }      // "Jones, Alex" -> "Alex Jones"
    return l.replace(/\s+/g, ' '); });
}
const isNumberLogin = x => /^[A-Za-z0-9]+$/.test(x);      // a student number (or other ID) is used as the login as-is
function makeLogin(name){
  if (isNumberLogin(name)) return name.toLowerCase();
  const parts = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/\s+/).map(p => p.replace(/[^a-z]/g, '')).filter(Boolean);
  const first = parts[0] || 'student', last = parts.length > 1 ? parts[parts.length - 1] : '';
  const base = last ? first + '.' + last : first;                       // sam.patel
  if (!DB.students[base]) return base;
  for (let i = 2; ; i++) if (!DB.students[base + i]) return base + i;   // a second Sam Patel becomes sam.patel2
}
function makePin(){
  const used = new Set(Object.values(DB.students).map(s => s.pin));
  const weak = p => /^(\d)\1{3}$/.test(p) || '01234567890'.includes(p) || '09876543210'.includes(p) || /^(19|20)\d\d$/.test(p);   // no 1111, 1234, or years
  let p; do { const a = new Uint32Array(1); crypto.getRandomValues(a); p = String(a[0] % 10000).padStart(4, '0'); } while (weak(p) || used.has(p));
  return p;
}
function addStudents(cls, names){
  names.forEach(n => {
    if (isNumberLogin(n) && DB.students[n.toLowerCase()]){ const st = DB.students[n.toLowerCase()]; if (!st.classIds.includes(cls.id)) st.classIds.push(cls.id); return; }   // already has a login: just join this class
    const login = makeLogin(n); DB.students[login] = { key: login, name: n, login, pin: makePin(), classIds: [cls.id] }; });
}
function tbar(title, back, backLabel){ setBar(title, false); return crumb(back, backLabel); }
function twoClick(label, armedLabel, action, attrs){        // a button that needs a second click to confirm
  let armed = false;
  const b = h('button', Object.assign({ type: 'button', onclick: () => {
    if (!armed){ armed = true; b.textContent = armedLabel; setTimeout(() => { armed = false; b.textContent = label; }, 2500); return; }
    action(); } }, attrs), label);
  return b;
}

  const parts = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[\s._-]+/).map(p => p.replace(/[^a-z]/g, '')).filter(Boolean);
  const base = (parts.length > 1 ? parts[0][0] + '.' + parts[parts.length - 1] : parts[0]) || 'teacher';      // p.hammersley

    sCard.replaceChildren(h('div', { class: 'hw-row' }, h('h2', {}, 'Suggested revision homework for the class'), lengthSel(drawClassPlan)));

    const title = 'Revision: ' + plan.weak.map(w => topicName(w.t)).join(', ');
    sCard.append(h('p', { style: 'margin:0' }, `Aimed at the class’s weakest sub-topics: ${weakText(plan.weak)}. It starts with the question types the class lost most marks on, with new numbers.`),

      h('div', { class: 'io-row' },
        h('button', { type: 'button', class: 'ghost', onclick: () => screenPreview(cls, withWhy(buildHW('tmp', title, INTRO(size.short), plan.qs), plan.items), () => screenAnalysis(cls)) }, 'Preview'),
        h('button', { type: 'button', class: 'ghost', onclick: () => screenBuilder(cls, { title, target: plan.items.length, items: plan.items.slice(), kind: 'suggested', back: () => screenAnalysis(cls) }) }, 'Edit in builder'),
        h('button', { type: 'button', class: 'primary', onclick: () => { afterClassSet(cls, createCustom(cls, title, plan.items, null, 'suggested')); save_(); screenClass(cls); } }, 'Set for this class')));
  };
  drawClassPlan(); app.append(sCard);

  // individual improvement homeworks
  const iCard = h('div', { class: 'card stack' });
  const drawIndividual = () => {
    const size = SIZES.find(s => s.min === SUG.min);
    iCard.replaceChildren(h('div', { class: 'hw-row' }, h('h2', {}, 'Improvement homework for each student'), lengthSel(drawIndividual)),
      h('p', { class: 'muted', style: 'margin:0' }, 'Each student gets different questions, chosen from their own weakest sub-topics and the question types they dropped marks on.'));
    const hasOpen = st => Object.keys(cls.assigned).some(id => { const a = cls.assigned[id], c = DB.custom[id]; return a.only && a.only.includes(st.key) && c && c.kind === 'improve' && !(st.work && st.work[id] && st.work[id].submitted); });
    const plans = studs.map(st => ({ st, open: hasOpen(st), plan: planImprovement(recs.filter(r => r.stu === st.key), size.marks, 'imp.' + st.key + today() + SUG.min) }));
    const tb = h('tbody');
    plans.forEach(({ st, plan, open }) => {
      const title = plan ? 'Improvement homework: ' + plan.weak.map(w => topicName(w.t)).join(', ') : '';
      tb.append(h('tr', {}, h('td', {}, h('button', { type: 'button', class: 'linkbtn', onclick: () => screenStudentAnalysis(cls, st) }, st.name)),
        h('td', {}, plan ? weakText(plan.weak) : h('span', { class: 'muted' }, 'No marked work yet')),
        h('td', { class: 'num' }, plan ? `${plan.items.length} questions · ${plan.total} marks` : ''),
        h('td', {}, open ? h('span', { class: 'muted' }, 'Has one to finish') : plan ? h('div', { class: 'io-row' },
          h('button', { type: 'button', class: 'linkbtn', onclick: () => screenPreview(cls, withWhy(buildHW('tmp', title, INTRO(size.short), plan.qs), plan.items), () => screenAnalysis(cls)) }, 'Preview'),
          h('button', { type: 'button', class: 'linkbtn', onclick: () => screenBuilder(cls, { title, target: plan.items.length, items: plan.items.slice(), forStudent: st.key, kind: 'improve', back: () => screenAnalysis(cls) }) }, 'Edit')) : null)));
    });
    const ready = plans.filter(x => x.plan && !x.open), skipped = plans.filter(x => x.plan && x.open).length, due = h('input', { class: 'inp', type: 'date', style: 'width:auto', 'aria-label': 'Due date' });
    iCard.append(...[h('div', { style: 'overflow-x:auto' }, h('table', { class: 'res' }, h('thead', {}, h('tr', {}, h('th', {}, 'Student'), h('th', {}, 'Focus (their score)'), h('th', { class: 'num' }, 'Size'), h('th'))), tb)),
      ready.length ? h('div', { class: 'io-row' }, h('span', { class: 'muted' }, 'Due'), due,
        h('button', { type: 'button', class: 'primary', onclick: () => {
          ready.forEach(({ st, plan }) => { const id = createCustom(cls, 'Improvement homework: ' + plan.weak.map(w => topicName(w.t)).join(', '), plan.items, [st.key], 'improve'); cls.assigned[id].due = due.value; });
          save_(); screenClass(cls); } }, `Set improvement homework for ${ready.length} student${ready.length === 1 ? '' : 's'}`)) : null,
      skipped ? h('p', { class: 'muted', style: 'margin:0;font-size:.92rem' }, `${skipped} student${skipped === 1 ? ' already has' : 's already have'} an improvement homework to finish, so ${skipped === 1 ? 'is' : 'are'} left out.`) : null].filter(Boolean));
  };
  drawIndividual(); app.append(iCard);
}

function screenStudentAnalysis(cls, st){
  app.replaceChildren(); window.scrollTo(0, 0);
  app.append(tbar(cls.name, () => screenAnalysis(cls), '← Class analysis'), h('h1', {}, st.name));
  const all = records(cls), recs = all.filter(r => r.stu === st.key);
  if (!recs.length){ app.append(h('div', { class: 'card muted' }, `${st.name} has no marked work yet.`)); return; }
  const a = group(recs, () => 1)[1], ca = group(all, () => 1)[1];
  const ids = Object.keys(cls.assigned).filter(id => getHW(id) && hwStudents(cls, id).includes(st));
  const subm = ids.filter(id => st.work && st.work[id] && st.work[id].submitted).length;
  const checked = recs.filter(r => r.ai && r.self != null), over = checked.filter(r => r.self > r.got), weakN = recs.filter(r => r.ai && r.ai.correction === 'weak').length;
  app.append(h('div', { class: 'tiles' },
    tile('Average', pc(a.got, a.marks) + '%', `class average ${pc(ca.got, ca.marks)}%`),
    tile('Homework submitted', `${subm}/${ids.length}`),
    tile('Self-marking', checked.length ? (over.length ? `+${over.reduce((s, r) => s + r.self - r.got, 0)} marks` : 'Accurate') : 'Not checked', checked.length ? `over-marked ${over.length} of ${checked.length} checked parts` : ''),
    tile('Weak corrections', String(weakN))));

  const tg = group(recs, r => r.topic), ctg = group(all, r => r.topic);
  app.append(h('div', { class: 'card stack' }, h('h2', {}, 'Sub-topics'), h('p', { class: 'muted', style: 'margin:0;font-size:.92rem' }, 'The dark mark on each bar is the class average.'),
    Object.keys(tg).sort((x, y) => pc(tg[x].got, tg[x].marks) - pc(tg[y].got, tg[y].marks)).map(t => meterRow(topicName(t), tg[t], pc(ctg[t].got, ctg[t].marks)))));
  const kg = group(recs, r => r.kind), ckg = group(all, r => r.kind);
  app.append(h('div', { class: 'card stack' }, h('h2', {}, 'Types of question'), Object.keys(KINDS).filter(k => kg[k]).map(k => meterRow(KINDS[k], kg[k], pc(ckg[k].got, ckg[k].marks)))));

  const hist = h('tbody');
  ids.forEach(id => { const hw = getHW(id), w = st.work && st.work[id], rs = recs.filter(r => r.hw === id), g = group(rs, () => 1)[1];
    hist.append(h('tr', {}, h('td', {}, h('button', { type: 'button', class: 'linkbtn', onclick: () => { setHW(hw); CURQ = 0; screenTeacherStudent(st, cls); } }, hw.title)),
      h('td', {}, w && w.submitted ? 'Submitted' : w && Object.values(w.parts).some(p => p.locked) ? 'In progress' : 'Not started'),
      h('td', { class: 'num' }, g ? `${pc(g.got, g.marks)}%` : '–'))); });
  app.append(h('div', { class: 'card stack' }, h('h2', {}, 'Homework'), h('table', { class: 'res' }, h('thead', {}, h('tr', {}, h('th', {}, 'Homework'), h('th', {}, 'Status'), h('th', { class: 'num' }, 'Score'))), hist)));

  const notes = recs.filter(r => r.ai && r.ai.note && r.got < r.marks);
  if (notes.length){ const mg = group(notes, r => categorise(r.ai.note));
    app.append(h('div', { class: 'card stack' }, h('h2', {}, 'Mistakes from Claude’s checks'),
      Object.entries(mg).sort((x, y) => y[1].n - x[1].n).map(([name, v]) => h('details', { class: 'mist' }, h('summary', {}, h('b', {}, name), h('span', { class: 'muted' }, ` · ${v.n}`)),
        h('ul', {}, v.recs.map(r => h('li', {}, `${r.tag}, ${r.tpl} ${r.pi}: ${r.ai.note}`)))))));
  }

  const card = h('div', { class: 'card stack' });
  const draw = () => {
    const size = SIZES.find(s => s.min === SUG.min), plan = planImprovement(recs, size.marks, 'imp.' + st.key + today() + SUG.min);
    card.replaceChildren(h('div', { class: 'hw-row' }, h('h2', {}, 'Suggested improvement homework'), lengthSel(draw)));
    if (!plan) return card.append(h('p', { class: 'muted' }, 'Not enough marked work yet.'));
    const title = 'Improvement homework: ' + plan.weak.map(w => topicName(w.t)).join(', ');
    const lost = [...new Set(plan.items.map(it => it.code.split('-')[0]).filter(t => recs.some(r => r.tpl === t && r.got < r.marks)))];
    card.append(h('p', { style: 'margin:0' }, `Focus: ${weakText(plan.weak)}.` + (lost.length ? ` Includes ${lost.length} question type${lost.length > 1 ? 's' : ''} ${st.name.split(' ')[0]} dropped marks on, with new numbers.` : '')),
      h('ol', { class: 'trayl' }, plan.qs.map((q, i) => h('li', {}, h('div', {}, h('b', {}, `${i + 1}. ${q.topicName}`), h('span', { class: 'muted' }, ` · type ${q.id} · ${q.marks} marks`), h('div', { class: 'why-s' }, plan.items[i].why))))),
      h('div', { class: 'io-row' },
        h('button', { type: 'button', class: 'ghost', onclick: () => screenPreview(cls, withWhy(buildHW('tmp', title, INTRO(size.short), plan.qs), plan.items), () => screenStudentAnalysis(cls, st)) }, 'Preview'),
        h('button', { type: 'button', class: 'ghost', onclick: () => screenBuilder(cls, { title, target: plan.items.length, items: plan.items.slice(), forStudent: st.key, kind: 'improve', back: () => screenStudentAnalysis(cls, st) }) }, 'Edit in builder'),
        h('button', { type: 'button', class: 'primary', onclick: () => { createCustom(cls, title, plan.items, [st.key], 'improve'); save_(); screenClass(cls); } }, `Set for ${st.name}`)));
  };
  draw(); app.append(card);
}

/* ================= demo class with sample results (mock-up only) ================= */
// a sample answer that earns exactly `got` marks, with a matching correction and check note
function sci3(x){ if (!isFinite(x)) return '?'; const a = Math.abs(x); if (a !== 0 && (a >= 1e4 || a < 1e-2)){ let e = Math.floor(Math.log10(a)), m = x / Math.pow(10, e); m = Number(m.toPrecision(3)); if (Math.abs(m) >= 10){ m /= 10; e++; } return `${m} × 10^${e}`.replace(/-/g, '−'); } return String(Number(x.toPrecision(3))).replace('-', '−'); }
function demoAnswer(P, got, rnd, pick, weakCorr){
  const R = P.raw, unit = plainText(R.unit || ''), show = R.show ? plainText(R.show) : '';
  const lines = R.ms.split('<br>').map(plainText).map(l => l.replace(/\s*✓/g, '').trim()).filter(l => l && !/^(Answer given to|Unit:)/.test(l));
  const lower = t => t.charAt(0).toLowerCase() + t.slice(1), sentence = arr => arr.map((t, i) => i ? lower(t) : t).join(', ').replace(/\.?$/, '.');
  const weakText = pick(['I got this one wrong, sorry.', 'Will revise this one before the test.', 'I understand it now.']);
  const arc = (bad) => { const p = []; for (let i = 0; i <= 30; i++){ const t = i / 30; if (bad){ p.push(Math.round(120 + 420 * t), Math.round(70 + 260 * t * t)); } else { const a = -Math.PI / 2 + t * Math.PI * .75; p.push(Math.round(140 + 200 * Math.cos(a) + 0), Math.round(270 + 200 * Math.sin(a))); } } return p; };
  const out = { text: '', strokes: [], note: '', green: '' };
  if (R.ans !== undefined && !R.options && P.kind !== 'written'){
    if (P.kind === 'graph'){                                  // a value read from a graph or a gradient
      if (got === P.marks){ out.text = lines.join('\n') + (show ? '' : ''); return out; }
      const v = R.ans * pick([1.2, .8, 1.25]);
      out.text = `${lines[0] || 'From the graph'}\n= ${sci3(v)} ${unit}`; out.note = 'Reading from the graph outside the allowed range: the triangle used for the gradient was too small or a value was misread.';
      out.green = weakCorr ? weakText : `Correct answer: ${show} ${unit}. I should use a bigger triangle and read the scale more carefully.`; return out;
    }
    const working = lines.slice(0, -1), last = lines[lines.length - 1] || '';
    const sym = (last.match(/^([^=]{1,12})=/) || [, ''])[1].trim(), lhs = sym ? sym + ' = ' : '= ';
    if (got === P.marks){ out.text = lines.join('\n') + (P.sf && !last.includes(show) ? `\n${lhs}${show} ${unit}` : ''); return out; }
    const lost = P.marks - got, kinds = got === 0 ? ['zero'] : ['pow10', 'arith'].concat(P.sf && lost === 1 ? ['sf', 'sf'] : [], P.unit && lost === 1 ? ['unit', 'unit'] : []);
    const k = pick(kinds);
    if (k === 'zero'){ out.text = `${lhs}${sci3(R.ans * pick([2, .5, 4]))} ${unit}`; out.note = 'No valid working and the final answer is wrong: wrong equation or rearrangement used.'; out.green = weakCorr ? weakText : `I used the wrong equation. It should be: ${lines[0]}. Answer ${show} ${unit}.`; }
    if (k === 'pow10'){ out.text = working.concat([`${lhs}${sci3(R.ans * pick([100, 1000, .001, .01]))} ${unit}`]).join('\n'); out.note = 'Power-of-ten error: a prefix (such as c, m, k or μ) was not converted to the base unit.'; out.green = weakCorr ? weakText : `Correct answer: ${show} ${unit}. I forgot to convert the prefix to the base unit before substituting.`; }
    if (k === 'arith'){ out.text = working.concat([`${lhs}${sci3(R.ans * pick([1.5, .6, 1.1]))} ${unit}`]).join('\n'); out.note = 'Substitution correct, but an arithmetic slip in the final step gave the wrong answer.'; out.green = weakCorr ? weakText : `Correct answer: ${show} ${unit}. I typed it into my calculator wrong, so I should check the last step.`; }
    if (k === 'sf'){ out.text = lines.join('\n') + `\n${lhs}${Number(R.ans.toPrecision(5))} ${unit}`; out.note = 'Final answer not given to an appropriate number of significant figures.'; out.green = weakCorr ? weakText : `Should be given as ${show} ${unit}, to the same number of significant figures as the data.`; }
    if (k === 'unit'){ out.text = working.concat([`${lhs}${show}`]).join('\n'); out.note = 'Unit missing from the final answer.'; out.green = weakCorr ? weakText : `I left off the unit. It should be ${show} ${unit}.`; }
    return out;
  }
  if (R.options && R.correct !== undefined){                   // a short answer such as a direction
    const right = plainText(R.options[R.correct]), reason = lines.slice(1).join(' ');
    if (got === P.marks){ out.text = right.charAt(0).toUpperCase() + right.slice(1) + (reason && rnd() < .5 ? '. ' + reason : ''); return out; }
    const wrong = plainText(pick(R.options.filter((o, i) => i !== R.correct)));
    out.text = wrong.charAt(0).toUpperCase() + wrong.slice(1);
    out.note = /page|left|right|clockwise|towards|upwards|downwards|from /i.test(wrong) ? `Direction wrong: gave “${wrong}” instead of “${right}”; hand rule misapplied.` : `Wrong choice: gave “${wrong}” instead of “${right}”.`;
    out.green = weakCorr ? weakText : `It is ${right}. ${reason}`.trim(); return out;
  }
  const pts = lines.length ? lines : ['(see mark scheme)'];
  const sketch = /^(Sketch|Draw)|\b(sketch|draw)\b/i.test(P.q);
  if (sketch) out.strokes = [{ c: 'k', p: arc(got < P.marks) }];
  if (got === P.marks){ out.text = sentence(pts); return out; }
  if (got === 0){ out.text = pick(['Because of the magnetic field.', 'It changes because the other quantity changes.', 'It depends on the current.']);
    out.note = sketch ? `Sketch: ${pts[0]} not shown.` : 'Explanation incomplete: neither marking point given.'; }
  else { out.text = sentence(pts.slice(0, got)); out.note = sketch ? `Sketch: ${pts[got] || pts[pts.length - 1]} not shown.` : `Explanation incomplete: missing “${pts[got] || pts[pts.length - 1]}”.`; }
  out.green = weakCorr ? weakText : 'Missed: ' + pts.slice(got).join('; ') + '.';
  if (sketch && !weakCorr) out.strokes.push({ c: 'g', p: arc(false).map((v, i) => i % 2 ? v + 6 : v + 6) });
  return out;
}
function removeClass(cls){
  classStudents(cls).forEach(st => { st.classIds = st.classIds.filter(id => id !== cls.id); if (!st.classIds.length){ delete DB.students[st.key]; Object.values(DB.checks).forEach(c => delete c[st.key]); } });
  delete DB.classes[cls.id];
}
function createDemoClass(){
  const names = ['Amara Okafor', 'Ben Hughes', 'Chloe Wright', 'Daniel Kim', 'Ella Thompson', 'Farhan Ali', 'Grace Murphy', 'Harry Evans', 'Isla Campbell', 'Jamal Hassan', 'Katie Lewis', 'Leo Martins'];
  const cls = { id: 'c' + Date.now().toString(36), name: 'Demo 13X (sample results)', assigned: {}, demo: true, demoVersion: 3 };
  DB.classes[cls.id] = cls; addStudents(cls, names);
  const rnd = seeded('demo-class'), pick = a => a[Math.floor(rnd() * a.length)], day = 864e5, now = Date.now(), studs = classStudents(cls);
  const prof = {}; studs.forEach(s => { const t = {}; BANK.MF.order.forEach(k => { t[k] = (rnd() - .5) * .4; });
    prof[s.key] = { a: .5 + rnd() * .4, t, written: (rnd() - .65) * .3, calc: (rnd() - .4) * .2, over: rnd() < .3 ? .4 : .07, lazy: rnd() < .17 }; });
  [['MF.FW.30.A', 21], ['MF.MC.60.B', 14], ['MF.EI.30.C', 7], ['MF.ALL.60.D', 2]].forEach(([id, ago]) => {
    const hw = getHW(id); if (!hw) return; DB.packs[id] = hw.codes;
    cls.assigned[id] = { due: new Date(now - ago * day).toISOString().slice(0, 10) }; setHW(hw);
    const when = new Date(now - (ago + 1) * day).toISOString(), checks = DB.checks[id] = DB.checks[id] || {};
    studs.forEach(s => { const pr = prof[s.key], r = rnd(), status = (pr.lazy && r < .6) || r < .06 ? 'none' : r < .14 ? 'partial' : 'done';
      if (status === 'none') return;
      const w = workFor(s);
      ALL_PARTS.forEach((P, i) => { if (status === 'partial' && i > ALL_PARTS.length / 2) return;
        const Q = hw.questions.find(q => q.parts.includes(P));
        const p = Math.max(.05, Math.min(.97, pr.a + (pr.t[Q.topic] || 0) + (P.kind === 'written' ? pr.written : P.kind === 'calc' ? pr.calc : -.08)));
        let got = 0; for (let k = 0; k < P.marks; k++) if (rnd() < p) got++;
        const self = Math.min(P.marks, got + (rnd() < pr.over ? 1 : 0));
        const weak = self < P.marks && rnd() < .06, A = demoAnswer(P, got, rnd, pick, weak);
        Object.assign(w.parts[P.id], { text: A.text, strokes: A.strokes, locked: when, mark: self, markLocked: when, green: self < P.marks ? A.green : '' });
        if (status === 'done') (checks[s.key] = checks[s.key] || {})[P.id] = { suggested: got, correction: weak ? 'weak' : 'ok', note: A.note };
      });
      if (status === 'done') w.submitted = when;
    });
  });
  save_(); return cls;
}

(function boot(){
  if (!CFG.url){ app.append(h('p', { class: 'err' }, 'The site isn’t connected to its database yet (config.js is missing).')); return; }
  if (!SESSION) return screenLogin();
  LOADED_AT = 0; app.replaceChildren(h('p', { class: 'muted', role: 'status' }, 'Loading…'));
  reload().then(() => SESSION.kind === 'student' ? screenList() : STAFF.mustChange ? screenStaffPassword(true) : screenTeacher(),
    () => { setSession(null); screenLogin(); });
})();
